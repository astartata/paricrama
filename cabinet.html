<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Личный кабинет — Парикрама 2026</title><link rel="stylesheet" href="styles.css"><style>.cabinet{max-width:760px;margin:0 auto;padding:28px 18px}.cabinet-card{background:#fffdfb;border:1px solid #e8e0d7;border-radius:18px;padding:24px;box-shadow:0 10px 30px #4435240d;margin-bottom:16px}.cabinet h1,.cabinet h2{font-family:'Playfair Display',serif}.cabinet h1{margin:0 0 6px}.cabinet h2{margin:0 0 16px}.cabinet p{color:#80766e;font-size:13px;line-height:1.6}.cabinet-actions{display:flex;gap:10px;flex-wrap:wrap}.cabinet-button{border:0;border-radius:9px;padding:11px 15px;background:#d66e35;color:white;font:700 12px Manrope;cursor:pointer}.cabinet-button.secondary{background:#fff;border:1px solid #e4ddd5;color:#665d57}.cabinet-status{padding:12px;border-radius:10px;background:#fff8ed;color:#8a6b4c;font-size:12px}.person{padding:13px 0;border-bottom:1px solid #eee7df}.person:last-child{border-bottom:0}.muted{color:#8a8078;font-size:12px}.hidden{display:none}</style></head>
<body><main class="cabinet"><div class="cabinet-card"><h1>Личный кабинет</h1><p>Парикрама 2026</p><div id="login-box"><p>Введите email, указанный в заявке. Мы отправим бесплатную ссылку для входа.</p><div class="field"><label>Email</label><input id="cabinet-email" type="email" placeholder="your@email.com"></div><div class="cabinet-actions" style="margin-top:12px"><button id="send-link" class="cabinet-button">Получить ссылку</button><a href="participant.html" class="cabinet-button secondary">К регистрации</a></div><div id="cabinet-status" class="cabinet-status hidden" style="margin-top:14px"></div></div><div id="user-box" class="hidden"><div class="cabinet-actions"><span id="user-email" class="muted"></span><button id="logout" class="cabinet-button secondary">Выйти</button></div></div></div><div id="application" class="cabinet-card hidden"><h2>Моя заявка</h2><div id="application-content"></div></div></main>
<script type="module">import {auth,db} from './firebase-config.js';import {collection,getDocs,query,where} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';import {sendSignInLinkToEmail,isSignInWithEmailLink,signInWithEmailLink,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
const $=id=>document.getElementById(id),status=$('cabinet-status');const settings={url:location.href.split('?')[0],handleCodeInApp:true};
async function send(){const email=$('cabinet-email').value.trim();if(!email){status.textContent='Введите email';status.classList.remove('hidden');return}try{await sendSignInLinkToEmail(auth,email,settings);localStorage.setItem('emailForSignIn',email);status.textContent='Ссылка отправлена. Проверьте почту и папку «Спам».';status.classList.remove('hidden')}catch(e){status.textContent='Не удалось отправить ссылку: '+e.message;status.classList.remove('hidden')}}
if(isSignInWithEmailLink(auth,location.href)){let email=localStorage.getItem('emailForSignIn')||prompt('Введите email для подтверждения');if(email)signInWithEmailLink(auth,email,location.href).then(()=>{localStorage.removeItem('emailForSignIn');history.replaceState({},'',location.pathname)}).catch(e=>{status.textContent='Ссылка недействительна или устарела: '+e.message;status.classList.remove('hidden')})}
$('send-link').onclick=send;$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{if(!user){$('login-box').classList.remove('hidden');$('user-box').classList.add('hidden');$('application').classList.add('hidden');return}$('login-box').classList.add('hidden');$('user-box').classList.remove('hidden');$('application').classList.remove('hidden');$('user-email').textContent=user.email;const snap=await getDocs(query(collection(db,'registrations'),where('loginEmail','==',user.email)));const rows=snap.docs.map(x=>x.data());$('application-content').innerHTML=rows.length?rows.map(r=>`<div class="person"><b>${(r.participants||[]).map(p=>p.name).join(', ')}</b><div class="muted">Email: ${r.loginEmail||user.email}</div><div class="muted">Выбранные места: ${(r.beds||[]).join(', ')||'не выбраны'}</div><div class="muted">Статус: ${r.status==='new'?'заявка получена':r.status}</div>${(r.receipts||[]).map(x=>`<div><a href="${x.url}" target="_blank">Чек: ${x.name}</a></div>`).join('')}</div>`).join(''):'Заявка с таким email пока не найдена.'});</script></body></html>
